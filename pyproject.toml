[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-equity-lab"
version = "0.1.0"
description = "Explainable UK share ranking, walk-forward backtesting and paper trading"
requires-python = ">=3.9"
dependencies = [
  "streamlit>=1.35,<2",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "plotly>=5.20,<7",
  "yfinance>=0.2.40,<2",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["uk_equity_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
